<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyWeb — Architecture & Workflow Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #0f172a;
      --bg-card: #111a2e;
      --bg-card-hover: #17233f;
      --bg-card-active: #1c2b4d;
      --border: #1e293b;
      --border-subtle: #172033;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --brand-orange: #f97316;
      --brand-orange-glow: rgba(249, 115, 22, 0.25);
      --success: #10b981;
      --sidebar-width: 360px;
      --topbar-height: 56px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #f1f5f9;
      --bg-card-hover: #e2e8f0;
      --bg-card-active: #e0e7ff;
      --border: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-focus: #2563eb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --brand-orange: #ea580c;
      --brand-orange-glow: rgba(234, 88, 12, 0.15);
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility focus ring */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Sidebar Layout */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 30;
      transition: margin-left var(--transition), transform var(--transition);
      position: relative;
    }

    .sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-width));
    }

    /* Sidebar Header */
    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-secondary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon-wrapper {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--brand-orange-glow);
      flex-shrink: 0;
    }

    .brand-icon-wrapper svg {
      width: 22px;
      height: 22px;
      color: #ffffff;
    }

    .brand-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .badge-status .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .badge-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-subtle);
    }

    /* Search & Filter Section */
    .filter-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-secondary);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg.search-icon {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      color: var(--text-subtle);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 36px 8px 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-clear-btn {
      position: absolute;
      right: 28px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .search-clear-btn:hover {
      color: var(--text-main);
    }

    .kbd-shortcut {
      position: absolute;
      right: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-subtle);
      pointer-events: none;
      border: 1px solid var(--border-subtle);
    }

    /* Filter Segmented Control */
    .filter-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg-primary);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      padding: 6px 0;
      text-align: center;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--bg-secondary);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    /* Diagram List Container */
    .diagram-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .group-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
    }

    .group-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .group-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-subtle);
    }

    /* Diagram Card */
    .diagram-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .diagram-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .diagram-card.active {
      background: var(--bg-card-active);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 4px 16px var(--accent-glow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .diagram-card.active .card-title {
      color: var(--accent);
    }

    .type-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .pill-architecture { background: rgba(6, 182, 212, 0.14); color: #06b6d4; }
    .pill-erd { background: rgba(139, 92, 246, 0.14); color: #a78bfa; }
    .pill-sequence { background: rgba(245, 158, 11, 0.14); color: #f59e0b; }
    .pill-lifecycle { background: rgba(236, 72, 153, 0.14); color: #ec4899; }
    .pill-tree { background: rgba(100, 116, 139, 0.18); color: #94a3b8; }
    .pill-workflow { background: rgba(16, 185, 129, 0.14); color: #10b981; }

    .card-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-primary);
      position: relative;
      min-width: 0;
    }

    /* Top Navigation Bar */
    .topbar {
      height: var(--topbar-height);
      min-height: var(--topbar-height);
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .sidebar-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .sidebar-toggle-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .breadcrumb-root {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-subtle);
    }

    .breadcrumb-sep {
      color: var(--border);
      font-size: 12px;
    }

    .breadcrumb-current {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      height: 32px;
      padding: 0 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all var(--transition);
    }

    .btn-action:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--border-focus);
    }

    .btn-action.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
    }

    .btn-action.primary:hover {
      background: var(--accent-hover);
    }

    .btn-icon-only {
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
    }

    /* Viewer Stage */
    .viewer-stage {
      flex: 1;
      width: 100%;
      height: calc(100% - var(--topbar-height));
      position: relative;
      background: var(--bg-primary);
    }

    .viewer-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      display: block;
    }

    /* Loading overlay */
    .stage-loader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--brand-orange));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 250ms ease;
      z-index: 10;
    }

    .stage-loader.loading {
      transform: scaleX(1);
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-subtle);
      background: var(--bg-primary);
    }

    .empty-state h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .empty-state p {
      font-size: 12.5px;
      color: var(--text-subtle);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 9px 15px;
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: all var(--transition);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
      }
      .sidebar.collapsed {
        transform: translateX(-100%);
        margin-left: 0;
      }
      .topbar-actions .btn-label {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon-wrapper" title="StudyWeb Code Architecture">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-details">
          <span class="brand-title">StudyWeb Archify</span>
          <span class="brand-subtitle">Architecture & Workflow Portal</span>
        </div>
      </div>
      <div class="header-meta">
        <div class="badge-status">
          <span class="pulse-dot"></span>
          <span>14 Specifications</span>
        </div>
        <span class="badge-count" id="filteredCountLabel">14/14</span>
      </div>
    </div>

    <!-- Search & Filter Section -->
    <div class="filter-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm sơ đồ... (Ctrl K)">
        <button id="searchClearBtn" class="search-clear-btn" title="Xoá tìm kiếm">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <span class="kbd-shortcut">/</span>
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">Tất cả (14)</button>
        <button class="tab-btn" data-filter="system">Kiến trúc (6)</button>
        <button class="tab-btn" data-filter="workflow">Quy trình (8)</button>
      </div>
    </div>

    <!-- Diagram List Container -->
    <div class="diagram-list" id="diagramList">
      <!-- Cards rendered via JavaScript -->
    </div>
  </aside>

  <!-- Main Viewer Content -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle-btn" id="toggleSidebar" title="Đóng/Mở Sidebar (Ctrl B)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <nav class="breadcrumb-nav">
          <span class="breadcrumb-root">Portal</span>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-current" id="currentBreadcrumb">Đang tải...</span>
        </nav>
      </div>

      <div class="topbar-actions">
        <!-- Theme Toggle -->
        <button class="btn-action btn-icon-only" id="themeToggleBtn" title="Chuyển chế độ Sáng / Tối">
          <svg id="themeIconDark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="themeIconLight" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Copy Path -->
        <button class="btn-action" id="copyPathBtn" title="Copy đường dẫn tệp">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-label">Copy Path</span>
        </button>

        <!-- Open New Tab -->
        <a class="btn-action" id="openExternalBtn" target="_blank" href="#" title="Mở trong tab trình duyệt độc lập">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span class="btn-label">Mở tab riêng</span>
        </a>

        <!-- Fullscreen -->
        <button class="btn-action primary" id="fullscreenBtn" title="Toàn màn hình">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span class="btn-label">Toàn màn hình</span>
        </button>
      </div>
    </header>

    <div class="viewer-stage" id="viewerStage">
      <div class="stage-loader" id="stageLoader"></div>
      <iframe id="diagramFrame" class="viewer-iframe" src=""></iframe>
      <div id="emptyState" class="empty-state" style="display: none;">
        <h3>Không tìm thấy sơ đồ phù hợp</h3>
        <p>Vui lòng thử từ khóa tìm kiếm khác hoặc chọn tab Tất cả</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span class="toast-dot"></span>
    <span id="toastMessage">Đã copy đường dẫn vào bộ nhớ tạm</span>
  </div>

  <script>
    const diagrams = [
      // Nhóm 1: Kiến trúc cốt lõi & CSDL (6 sơ đồ)
      {
        id: "system-architecture",
        group: "system",
        title: "Tổng quan Kiến trúc Hệ thống",
        type: "architecture",
        desc: "Phân tầng Frontend (FE/Admin), NestJS BE, PostgreSQL, Docker Sandbox & External APIs.",
        path: "./architecture-system-overview-20261024-143500/system-architecture.html",
        pillClass: "pill-architecture"
      },
      {
        id: "database-erd",
        group: "system",
        title: "Lược đồ Thực thể Cơ sở dữ liệu",
        type: "erd",
        desc: "Toàn bộ 18 models trong Prisma: Users, Sessions, Labs, Entitlements, Groups, Review, Audit.",
        path: "./erd-database-schema-20261024-145200/database-erd.html",
        pillClass: "pill-erd"
      },
      {
        id: "sequence-lab-execution",
        group: "system",
        title: "Thực thi Sandbox WebAssembly PGlite",
        type: "sequence",
        desc: "Luồng khởi tạo in-browser PGlite, nạp seed, thực thi SQL truy vấn và đối soát test case.",
        path: "./sequence-lab-execution-20261024-145400/lab-execution-sequence.html",
        pillClass: "pill-sequence"
      },
      {
        id: "sequence-dynamic-iam",
        group: "system",
        title: "Phân giải Quyền Dynamic IAM 5 Cấp",
        type: "sequence",
        desc: "Thứ tự phân giải quyền 5 bậc: User DENY > Direct ALLOW > Plan > IAM Groups > Free Plan.",
        path: "./sequence-dynamic-iam-20261024-145700/dynamic-iam-sequence.html",
        pillClass: "pill-sequence"
      },
      {
        id: "lifecycle-content-review",
        group: "system",
        title: "State Machine Duyệt & Xuất bản Nội dung",
        type: "lifecycle",
        desc: "Vòng đời 8 trạng thái duyệt bài: draft -> submitted -> changes_requested / approved -> published.",
        path: "./lifecycle-content-review-20261024-145900/content-review-lifecycle.html",
        pillClass: "pill-lifecycle"
      },
      {
        id: "tree-monorepo-structure",
        group: "system",
        title: "Cấu trúc Phân tầng Monorepo",
        type: "tree",
        desc: "Cấu trúc tổ chức thư mục của 3 module: MODULE_FE, MODULE_ADMIN, MODULE_BE.",
        path: "./tree-monorepo-structure-20261024-150100/monorepo-tree.html",
        pillClass: "pill-tree"
      },

      // Nhóm 2: Feature Workflows (8 sơ đồ)
      {
        id: "workflow-auth-session",
        group: "workflow",
        title: "Vòng đời Xác thực & Xoay vòng Token",
        type: "workflow",
        desc: "Đăng nhập, bcrypt verify, cấp phát Access Token (15m) & Refresh Token (7d), Sliding Window.",
        path: "./workflow-auth-session-20261024-152500/auth-session-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-catalog-discovery",
        group: "workflow",
        title: "Khám phá & Tra cứu Giáo trình",
        type: "workflow",
        desc: "Học viên duyệt Series/Labs, lọc độ khó, kiểm tra Feature Entitlement Gate và hiển thị Upgrade Modal.",
        path: "./workflow-catalog-discovery-20261024-152800/catalog-discovery-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-sql-lab",
        group: "workflow",
        title: "Thực hành Truy vấn SQL Tương tác",
        type: "workflow",
        desc: "Monaco Editor gõ SQL, In-Browser WASM PGlite Sandbox chấm test cases và đồng bộ tiến độ học.",
        path: "./workflow-sql-lab-20261024-153000/sql-lab-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-automation-v3",
        group: "workflow",
        title: "Hộp cát Thử nghiệm Automation V3",
        type: "workflow",
        desc: "Builder cấu hình steps, AST static analyzer kiểm tra cú pháp, Mock Execution Engine và báo cáo.",
        path: "./workflow-automation-v3-20261024-153200/automation-v3-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-contributor-studio",
        group: "workflow",
        title: "Studio Biên soạn & Kiểm thử Preflight",
        type: "workflow",
        desc: "Soạn thảo giáo trình Lab, kiểm thử Dry-Run Sandbox bắt buộc trước khi gửi đơn duyệt.",
        path: "./workflow-contributor-studio-20261024-153300/contributor-studio-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-content-review",
        group: "workflow",
        title: "Hàng đợi Xét duyệt & Xuất bản Giáo trình",
        type: "workflow",
        desc: "Admin tiếp nhận bài, claim queue, yêu cầu sửa đổi hoặc phê duyệt xuất bản trực tiếp kèm Audit Log.",
        path: "./workflow-content-review-20261024-153400/content-review-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-dynamic-iam",
        group: "workflow",
        title: "Quản trị Phân quyền & Giám sát Truy cập",
        type: "workflow",
        desc: "Guard chặn truy cập, phân giải 5 bậc quyền hạn, cấp phép hành động và ghi nhận nhật ký quản trị.",
        path: "./workflow-dynamic-iam-20261024-153700/dynamic-iam-workflow.html",
        pillClass: "pill-workflow"
      },
      {
        id: "workflow-contributor-onboarding",
        group: "workflow",
        title: "Đăng ký & Onboarding Contributor",
        type: "workflow",
        desc: "Nộp đơn đăng ký Contributor (Bio, Portfolio, Sample Topic), Admin thẩm định và nâng cấp role.",
        path: "./workflow-contributor-onboarding-20261024-153900/contributor-onboarding-workflow.html",
        pillClass: "pill-workflow"
      }
    ];

    let currentDiagramId = diagrams[0].id;
    let currentFilter = "all";
    let searchQuery = "";

    // DOM Elements
    const diagramListEl = document.getElementById("diagramList");
    const diagramFrameEl = document.getElementById("diagramFrame");
    const currentBreadcrumbEl = document.getElementById("currentBreadcrumb");
    const openExternalBtn = document.getElementById("openExternalBtn");
    const copyPathBtn = document.getElementById("copyPathBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const toggleSidebarBtn = document.getElementById("toggleSidebar");
    const sidebarEl = document.getElementById("sidebar");
    const emptyStateEl = document.getElementById("emptyState");
    const toastEl = document.getElementById("toast");
    const toastMessageEl = document.getElementById("toastMessage");
    const stageLoaderEl = document.getElementById("stageLoader");
    const filteredCountLabel = document.getElementById("filteredCountLabel");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIconDark = document.getElementById("themeIconDark");
    const themeIconLight = document.getElementById("themeIconLight");

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem("archify_theme") || "dark";
      setTheme(savedTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("archify_theme", theme);
      if (theme === "dark") {
        themeIconDark.style.display = "block";
        themeIconLight.style.display = "none";
      } else {
        themeIconDark.style.display = "none";
        themeIconLight.style.display = "block";
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") || "dark";
      setTheme(current === "dark" ? "light" : "dark");
    });

    // Render Diagram List
    function renderList() {
      diagramListEl.innerHTML = "";

      const filtered = diagrams.filter(d => {
        const matchesFilter = (currentFilter === "all") || (d.group === currentFilter);
        const matchesSearch = !searchQuery ||
          d.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.type.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.id.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      filteredCountLabel.textContent = `${filtered.length}/${diagrams.length}`;

      if (filtered.length === 0) {
        emptyStateEl.style.display = "flex";
        diagramFrameEl.style.display = "none";
        return;
      } else {
        emptyStateEl.style.display = "none";
        diagramFrameEl.style.display = "block";
      }

      const systemItems = filtered.filter(d => d.group === "system");
      const workflowItems = filtered.filter(d => d.group === "workflow");

      if (systemItems.length > 0) {
        const sectionEl = document.createElement("div");
        sectionEl.className = "group-section";
        sectionEl.innerHTML = `
          <div class="group-header">
            <span class="group-title">Kiến trúc & Cơ sở dữ liệu</span>
            <span class="group-count">${systemItems.length}</span>
          </div>
          <div class="group-container" id="systemContainer"></div>
        `;
        diagramListEl.appendChild(sectionEl);
        const container = sectionEl.querySelector("#systemContainer");
        systemItems.forEach(item => container.appendChild(createCard(item)));
      }

      if (workflowItems.length > 0) {
        const sectionEl = document.createElement("div");
        sectionEl.className = "group-section";
        sectionEl.innerHTML = `
          <div class="group-header">
            <span class="group-title">Quy trình Nghiệp vụ (Workflows)</span>
            <span class="group-count">${workflowItems.length}</span>
          </div>
          <div class="group-container" id="workflowContainer"></div>
        `;
        diagramListEl.appendChild(sectionEl);
        const container = sectionEl.querySelector("#workflowContainer");
        workflowItems.forEach(item => container.appendChild(createCard(item)));
      }
    }

    function createCard(item) {
      const a = document.createElement("a");
      a.className = `diagram-card ${item.id === currentDiagramId ? 'active' : ''}`;
      a.href = `#${item.id}`;
      a.setAttribute("data-id", item.id);
      a.innerHTML = `
        <div class="card-top">
          <span class="card-title">${item.title}</span>
          <span class="type-pill ${item.pillClass}">${item.type}</span>
        </div>
        <div class="card-desc">${item.desc}</div>
      `;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        loadDiagram(item.id);
        // Auto-close drawer on mobile
        if (window.innerWidth < 768) {
          sidebarEl.classList.add("collapsed");
        }
      });
      return a;
    }

    function loadDiagram(id) {
      const target = diagrams.find(d => d.id === id);
      if (!target) return;

      currentDiagramId = id;
      window.location.hash = id;

      // Indicator loader
      stageLoaderEl.classList.add("loading");
      setTimeout(() => stageLoaderEl.classList.remove("loading"), 250);

      // Frame & Info
      diagramFrameEl.src = target.path;
      currentBreadcrumbEl.textContent = target.title;
      openExternalBtn.href = target.path;

      // Active state on cards
      document.querySelectorAll(".diagram-card").forEach(el => {
        if (el.getAttribute("data-id") === id) {
          el.classList.add("active");
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          el.classList.remove("active");
        }
      });
    }

    // Search events
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      searchClearBtn.style.display = searchQuery ? "flex" : "none";
      renderList();
    });

    searchClearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      searchClearBtn.style.display = "none";
      searchInput.focus();
      renderList();
    });

    // Filter Tab click
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });

    // Toggle Sidebar
    toggleSidebarBtn.addEventListener("click", () => {
      sidebarEl.classList.toggle("collapsed");
    });

    // Fullscreen
    fullscreenBtn.addEventListener("click", () => {
      const stage = document.getElementById("viewerStage");
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(err => alert("Không thể mở toàn màn hình: " + err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Copy Path
    copyPathBtn.addEventListener("click", () => {
      const target = diagrams.find(d => d.id === currentDiagramId);
      if (!target) return;
      navigator.clipboard.writeText(target.path).then(() => {
        showToast("Đã copy đường dẫn sơ đồ vào bộ nhớ tạm");
      }).catch(() => {
        showToast(target.path);
      });
    });

    function showToast(text) {
      toastMessageEl.textContent = text;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    // Global Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      // Focus search: Ctrl+K or '/' when not in input
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInput.focus();
        return;
      }
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
        return;
      }
      // Toggle sidebar: Ctrl+B
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        sidebarEl.classList.toggle("collapsed");
        return;
      }
      // Clear or blur on Escape
      if (e.key === "Escape") {
        if (document.activeElement === searchInput) {
          searchInput.blur();
        }
        return;
      }
      // Arrow navigation
      if (document.activeElement !== searchInput) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          const currentIndex = diagrams.findIndex(d => d.id === currentDiagramId);
          if (currentIndex === -1) return;
          const nextIndex = e.key === "ArrowDown"
            ? (currentIndex + 1) % diagrams.length
            : (currentIndex - 1 + diagrams.length) % diagrams.length;
          loadDiagram(diagrams[nextIndex].id);
        }
      }
    });

    // Startup initialization
    initTheme();
    const initialHash = window.location.hash.replace("#", "");
    const initialDiagram = diagrams.find(d => d.id === initialHash) || diagrams[0];

    renderList();
    loadDiagram(initialDiagram.id);
  </script>
</body>
</html>
