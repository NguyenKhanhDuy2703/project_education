<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="studyit-favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D72FE"/>
      <stop offset="100%" stop-color="#054AD7"/>
    </linearGradient>
  </defs>
  <!-- Squircle container matching StudyIT brand design tokens -->
  <rect width="32" height="32" rx="7.5" fill="url(#studyit-favicon-grad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- StudyIT Icon: Open Book base + High-contrast Code glyphs -->
  <g transform="translate(4, 4) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center spine -->
    <path d="M12 5v14" stroke="#FFFFFF" stroke-width="2.2"/>
    <!-- Outer book contour with translucent page fill -->
    <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"
          stroke="#FFFFFF" stroke-width="2.2" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- Left page code bracket '<' in bright cyan -->
    <path d="M8.5 9 L5.8 11 L8.5 13" stroke="#BAE6FD" stroke-width="2"/>
    <!-- Right page code bracket '>' in bright cyan -->
    <path d="M15.5 9 L18.2 11 L15.5 13" stroke="#BAE6FD" stroke-width="2"/>
  </g>
</svg>
